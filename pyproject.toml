[project]
name = "wayfinding-document-scanner"
version = "0.1.0"
description = "Desktop scanner for extracting wayfinding material and finish requirements from searchable PDFs."
requires-python = ">=3.11"
dependencies = [
  "PyMuPDF>=1.24,<2",
  "PySide6>=6.8,<7",
]

[project.scripts]
wayfinding-scanner = "document_scanner.app:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
document_scanner = ["keywords.json"]
